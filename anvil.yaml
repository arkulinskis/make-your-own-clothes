metadata:
  description: "Draft made-to-measure sewing patterns, redraw them, sew them in 3D on a mannequin with your measurements, and follow a step-by-step making book."
  logo_img: "asset:icon-512.png"
  title: "Make Your Own Clothes: made-to-measure sewing patterns"
name: Make Your Own Clothes
