<div class="pa-card-host">
  <article class="ui-card pa-card">
    <div class="art"><anvil-component type="Make_Your_Own_Clothes.Components.Html" name="art"></anvil-component></div>
    <div class="body">
      <div class="meta">
        <anvil-component type="Label" name="kind_label" prop:role='["badge"]'></anvil-component>
        <anvil-component type="Make_Your_Own_Clothes.Components.Html" name="meter"></anvil-component>
        <anvil-component type="Label" name="time_label" prop:role='["inline"]'></anvil-component>
      </div>
      <h3><anvil-component type="Label" name="name_label" prop:role='["inline"]'></anvil-component></h3>
      <anvil-component type="Label" name="about_label" prop:role='["pa-about"]'></anvil-component>
      <div class="acts">
        <anvil-component type="Button" name="begin_button" prop:text="Begin" prop:role='["btn", "btn-sm", "btn-primary", "ic-scissors"]'></anvil-component>
        <anvil-component type="Button" name="detail_button" prop:text="Details" prop:role='["btn", "btn-sm"]'></anvil-component>
      </div>
    </div>
  </article>
</div>
