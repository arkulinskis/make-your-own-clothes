      <anvil-component type="Label" name="name" prop:role='["strong", "inline"]'></anvil-component>
      <a anvil:name="email_link" href="#"><anvil-component type="Label" name="email" prop:role='["inline"]'></anvil-component></a>
      <anvil-component type="Label" name="when" prop:role='["inline", "fine-print"]'></anvil-component>

    <anvil-component type="Label" name="note" prop:role='["msg-body"]'></anvil-component>
    <div class="ui-row">
      <anvil-component type="Button" name="verify_button" prop:text="Verify" prop:role='["btn", "btn-sm", "ic-check"]'></anvil-component>
      <anvil-component type="Button" name="decline_button" prop:text="Decline" prop:role='["btn", "btn-sm"]'></anvil-component>
      <span class="ui-spacer"></span>
      <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-sm", "btn-danger", "ic-trash"]'></anvil-component>
