<div class="rq-host">
  <a class="ui-card rq-card" anvil:name="card" href="#requests">
    <span class="art"><anvil-component type="Make_Your_Own_Clothes.Components.Html" name="art"></anvil-component></span>
    <span class="body">
      <span class="rq-badges"><anvil-component type="Label" name="kind" prop:role='["badge"]'></anvil-component>
        <anvil-component type="Label" name="invited" prop:role='["badge", "badge-brand"]' prop:text="Invited"></anvil-component>
        <anvil-component type="Label" name="matched" prop:role='["badge", "badge-good"]' prop:text="Matches your guild profile"></anvil-component>
        <anvil-component type="Label" name="quoted" prop:role='["badge", "badge-warn"]' prop:text="You quoted"></anvil-component>
        <anvil-component type="Label" name="mine" prop:role='["badge", "badge-brand"]' prop:text="Your request"></anvil-component></span>
      <span class="rq-title"><anvil-component type="Label" name="title" prop:role='["inline"]'></anvil-component></span>
      <anvil-component type="Label" name="where" prop:role='["fine-print"]'></anvil-component>
      <anvil-component type="Label" name="facts" prop:role='["fine-print"]'></anvil-component>
    </span>
  </a>
</div>
