<div class="st-seam-host">
  <div class="st-seam" anvil:name="box" anvil:on-dom:click="self.box_click" role="button" tabindex="0" anvil:on-dom:keydown="self.box_key">
    <anvil-component type="Label" name="name_label" prop:role='["st-seam-n"]'></anvil-component>
    <anvil-component type="Label" name="badge" prop:role='["badge"]'></anvil-component>
    <span class="v"><anvil-component type="Label" name="lens" prop:role='["inline"]'></anvil-component></span>
  </div>
  <anvil-component type="Button" name="remove_button" prop:text="Remove this seam" prop:role='["btn", "btn-sm", "btn-ghost", "st-seam-rm"]'></anvil-component>
</div>
