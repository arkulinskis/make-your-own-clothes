<div class="ar-host">
  <div class="ui-item">
    <div class="meta"><anvil-component type="Label" name="status" prop:role='["badge"]'></anvil-component>
      <anvil-component type="Label" name="who" prop:role='["strong", "inline"]'></anvil-component>
      <a anvil:name="email_link" href="#"><anvil-component type="Label" name="email" prop:role='["inline"]'></anvil-component></a>
      <anvil-component type="Label" name="when" prop:role='["inline", "fine-print"]'></anvil-component>
      <anvil-component type="Label" name="demo" prop:role='["badge"]' prop:text="Demo"></anvil-component></div>
    <p class="rv-for"><a anvil:name="req_link" href="#requests"><anvil-component type="Label" name="title" prop:role='["inline", "strong"]'></anvil-component></a> · <anvil-component type="Label" name="facts" prop:role='["inline"]'></anvil-component></p>
    <anvil-component type="Label" name="notes" prop:role='["msg-body"]'></anvil-component>
    <label class="ui-field"><span>Private note (only admins see it)</span><anvil-component type="TextArea" name="note_box" prop:height="54"></anvil-component></label>
    <div class="ui-row">
      <anvil-component type="Button" name="open_button" prop:text="On the board" prop:role='["btn", "btn-sm"]'></anvil-component>
      <anvil-component type="Button" name="accepted_button" prop:text="Quote accepted" prop:role='["btn", "btn-sm"]'></anvil-component>
      <anvil-component type="Button" name="closed_button" prop:text="Closed (off the board)" prop:role='["btn", "btn-sm"]'></anvil-component>
    </div>
  </div>
</div>
